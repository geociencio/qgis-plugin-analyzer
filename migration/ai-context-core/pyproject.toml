[project]
name = "ai-context-core"
version = "0.1.0"
description = "Core logic for AI-driven development context management"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Juan M. Bernales", email = "juanbernales@gmail.com"}
]
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
ai-ctx = "ai_context_core.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"
