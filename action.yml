name: 'QGIS Plugin Analyzer'
description: 'Professional static analysis tool for QGIS (PyQGIS) plugins.'
author: 'GeoCiencio'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  path:
    description: 'Path of the plugin directory to analyze'
    required: false
    default: '.'
  output:
    description: 'Directory to save analysis reports'
    required: false
    default: 'analysis_results'
  args:
    description: 'Additional CLI arguments (e.g. --profile release)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install QGIS Plugin Analyzer
      run: pip install ${{ github.action_path }}
      shell: bash

    - name: Run Analysis
      run: qgis-analyzer analyze "${{ inputs.path }}" -o "${{ inputs.output }}" ${{ inputs.args }}
      shell: bash
