[project]
name = "qgis-plugin-analyzer"
version = "0.8.0"
description = "A professional static analysis tool for QGIS (PyQGIS) plugins"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
qgis-analyzer = "analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["src/analyzer/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E701", "E501"] # Permite if cond: statement y líneas largas

[tool.ruff.lint.per-file-ignores]
"src/analyzer/reporters.py" = ["F401", "F403", "F405"] # Dominate usa mucho import *

[tool.qgis-analyzer.profiles.default]
strict = false
generate_html = true
fail_on_error = false

[tool.qgis-analyzer.profiles.release]
strict = true
generate_html = true
fail_on_error = true
# futuras expansiones:
# compile_docs = true
# deep_cleanup = true
