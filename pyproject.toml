[project]
name = "qgis-plugin-analyzer"
version = "1.10.0"
description = "A professional static analysis tool for QGIS (PyQGIS) plugins"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "geociencio", email = "juanbernales@gmail.com"}
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/geociencio/qgis-plugin-analyzer"
Documentation = "https://github.com/geociencio/qgis-plugin-analyzer/tree/main/docs"
Repository = "https://github.com/geociencio/qgis-plugin-analyzer.git"
Issues = "https://github.com/geociencio/qgis-plugin-analyzer/issues"
Chaneglog = "https://github.com/geociencio/qgis-plugin-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
qgis-analyzer = "analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.0.0",
    "qgis-stubs>=0.1",
    "pytest>=8.3.5",
    "PyYAML>=6.0",
    "types-pyyaml>=6.0.12.20241230",
    "build>=1.2.2.post1",
    "ai-context-core>=3.2.1",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false # Gradual adoption

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = ["src/analyzer/templates", ".ai-context"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E701", "E501"] # Permite if cond: statement y líneas largas

[tool.ruff.lint.per-file-ignores]
"src/analyzer/reporters.py" = ["F401", "F403", "F405"] # Dominate usa mucho import *
"src/analyzer/visitors/*.py" = ["N802"] # visit_* methods are part of ast.NodeVisitor API

[tool.qgis-analyzer.profiles.default]
strict = false
generate_html = true
fail_on_error = false

[tool.qgis-analyzer.profiles.release]
strict = true
generate_html = true
fail_on_error = true
# futuras expansiones:
# compile_docs = true
# deep_cleanup = true
