[project]
name = "qgis-plugin-analyzer"
version = "0.2.0"
description = "Un analizador estático profesional para plugins de QGIS (PyQGIS)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
qgis-analyzer = "analyzer.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
